name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache: the NuGet global-packages folder, keyed on the lock files, which name every package.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Directory.Build.props switches to locked-mode restore under GitHub Actions: a lock file
      # that does not match the packages fails the build instead of silently resolving others.
      - name: Restore
        run: dotnet restore PlotboekGenerator.slnx

      - name: Build
        run: dotnet build PlotboekGenerator.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PlotboekGenerator.slnx --no-build --configuration Release
