name: Release

# A tag v<major>.<minor>.<patch> publishes the image ghcr.io/gemberkoekje/plotboek-generator with the
# tags <major>.<minor>.<patch>, <major>.<minor> and latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cache: the NuGet packages, keyed on the lock files. A tag run sees only the default branch's
      # caches, so this restores the one ci.yml keeps on main (same key).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Test
        run: dotnet test PlotboekGenerator.slnx --configuration Release

      - name: Publish
        run: dotnet publish PlotboekGenerator.Host/PlotboekGenerator.Host.csproj --configuration Release --output publish -p:PublishReadyToRun=false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gemberkoekje/plotboek-generator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
